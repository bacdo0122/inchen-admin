# Compose dùng trên EC2. Khác bản dev: api KHÔNG build tại chỗ mà kéo image
# đã build sẵn từ GHCR (EC2 nhỏ build Nest rất dễ OOM và chậm).
#
# Chạy tay:      docker compose -f docker-compose.prod.yml up -d
# Rollback:      API_TAG=<sha-cũ> docker compose -f docker-compose.prod.yml up -d
name: inchem

services:
  # ── PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: inchem-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups
    # TUYỆT ĐỐI không mở 5432 ra ngoài trên production. Cần DBeaver thì dùng SSH tunnel.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    networks: [inchem]

  # ── API NestJS ────────────────────────────────────────────
  api:
    # API_TAG do GitHub Actions truyền vào (= commit SHA). Không có thì lấy latest.
    image: ghcr.io/bacdo0122/inchen-admin/api:${API_TAG:-latest}
    container_name: inchem-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Asia/Ho_Chi_Minh
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    # Chỉ loopback — Caddy/Nginx trên host reverse proxy vào đây.
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:4000/api/products >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    networks: [inchem]

volumes:
  db_data:

networks:
  inchem:
    driver: bridge
