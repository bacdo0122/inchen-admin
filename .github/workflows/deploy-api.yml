name: Deploy API + DB to EC2

on:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'docker-compose.prod.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag ảnh có sẵn để rollback (bỏ trống = build từ commit hiện tại)'
        required: false
        default: ''

# Không cho 2 lần deploy chạy chồng nhau lên cùng 1 server.
concurrency:
  group: deploy-api-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bacdo0122/inchen-admin/api
  DEPLOY_DIR: /opt/inchem

jobs:
  # ── 1. Build image trên runner rồi đẩy lên GHCR ───────────
  build:
    name: Build & push image
    if: github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Cache layer giữa các lần chạy — lần sau chỉ build lại phần thay đổi.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ── 2. SSH vào EC2, pull image, up compose ────────────────
  deploy:
    name: Deploy lên EC2
    needs: [build]
    # Chạy cả khi build bị skip (trường hợp rollback bằng tag có sẵn).
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Mỗi biến env = 1 GitHub Secret. Thêm biến mới thì phải khai báo thêm ở
      # khối env: bên dưới VÀ thêm tên vào REQUIRED hoặc OPTIONAL.
      - name: Dựng file .env từ các secret
        env:
          # ── bắt buộc ──
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          # ── tuỳ chọn, có giá trị mặc định nếu chưa tạo secret ──
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN || '7d' }}
          R2_FOLDER: ${{ secrets.R2_FOLDER || 'images' }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
        run: |
          set -eu
          REQUIRED="POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB JWT_SECRET CORS_ORIGINS
                    RESEND_API_KEY MAIL_FROM MAIL_TO
                    R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_PUBLIC_URL"
          OPTIONAL="JWT_EXPIRES_IN R2_FOLDER ADMIN_EMAIL ADMIN_PASSWORD ADMIN_NAME"

          missing=""
          for k in $REQUIRED; do
            [ -n "$(printenv "$k" || true)" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "❌ Chưa cấu hình secret:$missing"
            exit 1
          fi

          : > env.production
          for k in $REQUIRED $OPTIONAL; do
            v=$(printenv "$k" || true)
            # Biến tuỳ chọn bỏ trống thì không ghi vào file, để app dùng default của nó.
            [ -n "$v" ] || continue
            # Cắt CR nếu secret được dán từ Windows — mật khẩu kèm \r sẽ báo sai
            # mật khẩu mà nhìn mắt thường không thấy khác gì.
            printf '%s=%s\n' "$k" "$(printf '%s' "$v" | tr -d '\r')" >> env.production
          done

          echo "▶ Đã dựng env.production với $(wc -l < env.production) biến:"
          cut -d= -f1 env.production

      - name: Copy compose + env lên EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: docker-compose.prod.yml,env.production
          target: ${{ env.DEPLOY_DIR }}

      - name: Pull image & khởi động lại service
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_TAG: ${{ github.event.inputs.image_tag || github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: API_TAG,GHCR_USER,GHCR_TOKEN,DEPLOY_DIR
          script_stop: true
          script: |
            set -eu
            cd "$DEPLOY_DIR"

            # .env sinh từ secret PROD_ENV_FILE ở bước trên — GitHub là nguồn sự thật.
            if [ ! -f env.production ]; then
              echo "❌ Không thấy env.production vừa copy lên"
              exit 1
            fi
            mv -f env.production .env
            chmod 600 .env
            mkdir -p backups

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export API_TAG
            echo "▶ Deploy tag: $API_TAG"
            docker compose -f docker-compose.prod.yml pull
            # Entrypoint của api tự chạy `prisma migrate deploy` trước khi start.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "▶ Chờ api healthy..."
            status=starting
            for _ in $(seq 1 40); do
              status=$(docker inspect -f '{{.State.Health.Status}}' inchem-api 2>/dev/null || echo starting)
              [ "$status" = healthy ] && break
              [ "$status" = unhealthy ] && break
              sleep 5
            done

            if [ "$status" != healthy ]; then
              echo "❌ API không healthy (status=$status). Log 100 dòng cuối:"
              docker compose -f docker-compose.prod.yml logs --tail=100 api
              docker logout ghcr.io || true
              exit 1
            fi

            echo "✅ Deploy xong"
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
            docker logout ghcr.io
