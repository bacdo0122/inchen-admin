# Nginx cho web public (Next.js, container bind 127.0.0.1:3000).
#
# ĐÂY LÀ TEMPLATE: __DOMAIN__ do install-domain.sh thay — xem api.conf.
# map $http_upgrade và các upstream đã khai báo trong api.conf (cùng http
# context) — KHÔNG khai báo lại ở đây, sẽ lỗi duplicate.

server {
	listen 80;
	listen [::]:80;
	server_name __DOMAIN__ www.__DOMAIN__;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://__DOMAIN__$request_uri;
	}
}

# www → non-www, gộp về một domain duy nhất cho SEO
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name www.__DOMAIN__;

	ssl_certificate     /etc/ssl/cloudflare/__DOMAIN__/origin.pem;
	ssl_certificate_key /etc/ssl/cloudflare/__DOMAIN__/origin.key;
	ssl_protocols       TLSv1.2 TLSv1.3;

	return 301 https://__DOMAIN__$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name __DOMAIN__;

	# Cloudflare Origin Certificate — xem ghi chú trong api.conf.
	ssl_certificate     /etc/ssl/cloudflare/__DOMAIN__/origin.pem;
	ssl_certificate_key /etc/ssl/cloudflare/__DOMAIN__/origin.key;

	include snippets/cloudflare-realip.conf;

	ssl_protocols             TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache         shared:SSL:10m;
	ssl_session_timeout       1d;
	ssl_session_tickets       off;

	client_max_body_size 10M;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options    "nosniff"          always;
	server_tokens off;

	gzip            on;
	gzip_min_length 1024;
	gzip_proxied    any;
	gzip_types      application/json application/javascript text/plain text/css image/svg+xml;

	access_log /var/log/nginx/web.access.log;
	error_log  /var/log/nginx/web.error.log warn;

	# Asset build của Next có hash trong tên → cache vĩnh viễn ở trình duyệt.
	location /_next/static/ {
		proxy_pass http://inchem_web;
		include snippets/proxy-inchem.conf;
		proxy_cache_valid 200 60m;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location /_next/image {
		proxy_pass http://inchem_web;
		include snippets/proxy-inchem.conf;
	}

	location / {
		proxy_pass http://inchem_web;
		include snippets/proxy-inchem.conf;
	}
}
