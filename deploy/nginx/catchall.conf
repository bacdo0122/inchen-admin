# Chặn mọi request không khớp domain nào (quét IP thô, Host lạ, subdomain chưa
# khai báo). Không có file này thì server block đầu tiên trên :80/:443 —
# api.__DOMAIN__ — trở thành default_server và API bị lộ qua http://<ip>.
#
# File này KHÔNG chứa __DOMAIN__, dùng chung cho mọi domain.
# Cài vào: /etc/nginx/sites-available/catchall.conf → sites-enabled/

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	# 444 = đóng kết nối, không trả byte nào. Bot quét đỡ tốn tài nguyên hơn 301.
	return 444;
}

server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name _;

	# Từ chối ngay ở tầng TLS, không cần cert giả. Cần nginx >= 1.19.4
	# (Ubuntu 24.04 có 1.24 → ok). nginx -t sẽ báo nếu bản quá cũ.
	ssl_reject_handshake on;
}
