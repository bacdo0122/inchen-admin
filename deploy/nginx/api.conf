# Nginx cho API NestJS (container bind 127.0.0.1:4000).
#
# ĐÂY LÀ TEMPLATE: __DOMAIN__ được install-domain.sh thay bằng domain thật.
# Đừng copy tay vào /etc/nginx — chạy:
#     DOMAIN=1clickswaps.xyz bash deploy/nginx/install-domain.sh
#
# Mọi khai báo ở http context (map / limit_req_zone / upstream) gom hết vào file
# này; web.conf và admin.conf dựa vào đó → api.conf luôn phải được bật.
# KHÔNG bật kèm ip.conf — trùng map/upstream, nginx -t sẽ fail.

# Biến hỗ trợ WebSocket — bắt buộc khai báo ở http context.
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# Chống spam form báo giá: 10 request/phút/IP, cho phép dồn 5 request.
# Đây là lớp phòng thủ thứ 2, bổ sung cho @nestjs/throttler trong code.
limit_req_zone $binary_remote_addr zone=lead_limit:10m rate=10r/m;

# Chống dò mật khẩu trang đăng nhập admin: 5 lần/phút/IP (dùng trong admin.conf).
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

upstream inchem_api {
	server 127.0.0.1:4000;
	keepalive 32;
}

upstream inchem_web {
	server 127.0.0.1:3000;
	keepalive 32;
}

upstream inchem_admin {
	server 127.0.0.1:3001;
	keepalive 32;
}

# ── HTTP: chỉ để ACME xác thực + chuyển hướng sang HTTPS ──
server {
	listen 80;
	listen [::]:80;
	server_name api.__DOMAIN__;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

# ── HTTPS ──────────────────────────────────────────────────
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name api.__DOMAIN__;

	# Cloudflare Origin Certificate (15 năm, không cần gia hạn). Chỉ hợp lệ
	# giữa Cloudflare và server → bắt buộc bật proxy (mây cam) + SSL/TLS mode
	# Full (strict). Cert phải phủ cả __DOMAIN__ lẫn *.__DOMAIN__.
	ssl_certificate     /etc/ssl/cloudflare/__DOMAIN__/origin.pem;
	ssl_certificate_key /etc/ssl/cloudflare/__DOMAIN__/origin.key;

	# Trả lại IP thật của khách từ header CF-Connecting-IP. THIẾU DÒNG NÀY thì
	# limit_req dưới đây tính chung mọi khách vào một hạn mức → 1 bot là chặn cả web.
	include snippets/cloudflare-realip.conf;

	ssl_protocols             TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache         shared:SSL:10m;
	ssl_session_timeout       1d;
	ssl_session_tickets       off;

	# Upload ảnh sản phẩm / bảng màu. Mặc định Nginx chỉ cho 1MB →
	# admin upload ảnh sẽ dính 413 Request Entity Too Large.
	client_max_body_size 20M;
	client_body_timeout  60s;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options    "nosniff"          always;
	add_header X-Frame-Options           "DENY"             always;
	server_tokens off;

	gzip             on;
	gzip_min_length  1024;
	gzip_proxied     any;
	gzip_types       application/json application/javascript text/plain text/css image/svg+xml;

	access_log /var/log/nginx/api.access.log;
	error_log  /var/log/nginx/api.error.log warn;

	# Form liên hệ / báo giá — siết riêng
	location /api/leads {
		limit_req zone=lead_limit burst=5 nodelay;
		limit_req_status 429;
		proxy_pass http://inchem_api;
		include snippets/proxy-inchem.conf;
	}

	# Swagger đang tắt ở production (NODE_ENV=production), chặn luôn cho chắc
	location /api/docs {
		return 404;
	}

	location / {
		proxy_pass http://inchem_api;
		include snippets/proxy-inchem.conf;
	}
}
