# Snippet dùng chung cho mọi location proxy về container.
# Cài vào: /etc/nginx/snippets/proxy-inchem.conf

proxy_http_version 1.1;

# Header để NestJS biết client thật, không phải Nginx.
# Thiếu X-Forwarded-* thì throttler của Nest sẽ tính rate-limit theo IP của Nginx
# (127.0.0.1) cho MỌI request → chặn nhầm toàn bộ người dùng.
# $http_host (Host thô của khách) chứ không phải $host: $host cắt bỏ port, làm
# middleware admin redirect về http://<ip>/login mất ":8080" khi chạy bằng IP
# (xem ip.conf). Với domain qua Cloudflare thì hai biến này như nhau.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;

# WebSocket / SSE (chưa dùng nhưng để sẵn)
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

proxy_buffering on;
proxy_redirect off;
