# Nginx TẠM THỜI — chạy cả 3 app bằng IP thô, chỉ HTTP, KHÔNG HTTPS.
# Dùng khi chưa có domain. Có domain rồi thì tắt file này, bật web/api/admin.conf.
#
#   http://103.180.134.112        → web public   (container 127.0.0.1:3000)
#   http://103.180.134.112:8080   → admin CMS    (container 127.0.0.1:3001)
#   http://103.180.134.112:8081   → API NestJS   (container 127.0.0.1:4000)
#
# Cài vào: /etc/nginx/sites-available/ip.conf → symlink sang sites-enabled/
#
# CHỈ BẬT MỘT BỘ: hoặc ip.conf, hoặc {web,api,admin}.conf. Bật lẫn nhau sẽ lỗi
# duplicate ở map / limit_req_zone / upstream (cùng http context).
# api-ip.conf trong thư mục này đã bị file này thay thế — đừng bật kèm.
#
# Vì không có Cloudflare ở trước, $remote_addr chính là IP khách → limit_req
# chạy đúng, KHÔNG include snippets/cloudflare-realip.conf ở đây.

# Biến hỗ trợ WebSocket — bắt buộc khai báo ở http context.
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# Chống spam form báo giá: 10 request/phút/IP (lớp thứ 2, bổ sung @nestjs/throttler).
limit_req_zone $binary_remote_addr zone=lead_limit:10m rate=10r/m;

# Chống dò mật khẩu trang đăng nhập admin: 5 lần/phút/IP.
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

upstream inchem_web {
	server 127.0.0.1:3000;
	keepalive 32;
}

upstream inchem_admin {
	server 127.0.0.1:3001;
	keepalive 32;
}

upstream inchem_api {
	server 127.0.0.1:4000;
	keepalive 32;
}

# ── :80 — web public ──────────────────────────────────────
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	# "_" = nhận mọi Host, kể cả khi khách gõ thẳng IP.
	server_name _;

	client_max_body_size 10M;

	add_header X-Content-Type-Options "nosniff" always;
	# Bản chạy bằng IP là bản tạm: chặn Google index để sau này lên domain thật
	# không bị trùng nội dung (duplicate content) với http://<ip>.
	add_header X-Robots-Tag           "noindex, nofollow" always;
	server_tokens off;

	gzip            on;
	gzip_min_length 1024;
	gzip_proxied    any;
	gzip_types      application/json application/javascript text/plain text/css image/svg+xml;

	access_log /var/log/nginx/web.access.log;
	error_log  /var/log/nginx/web.error.log warn;

	location = /robots.txt {
		add_header Content-Type text/plain;
		return 200 "User-agent: *\nDisallow: /\n";
	}

	# Asset build của Next có hash trong tên → cache vĩnh viễn ở trình duyệt.
	location /_next/static/ {
		proxy_pass http://inchem_web;
		include snippets/proxy-inchem.conf;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location /_next/image {
		proxy_pass http://inchem_web;
		include snippets/proxy-inchem.conf;
	}

	location / {
		proxy_pass http://inchem_web;
		include snippets/proxy-inchem.conf;
	}
}

# ── :8080 — admin CMS ─────────────────────────────────────
# middleware.ts của admin redirect về /login bằng req.nextUrl (dựng từ header
# Host). Vì thế snippet proxy phải chuyển Host = $http_host (có kèm ":8080");
# nếu chỉ gửi $host thì Location trả về http://<ip>/login → rơi sang web public.
server {
	listen 8080;
	listen [::]:8080;
	server_name _;

	# Upload ảnh đi qua route handler /api/upload của chính admin → phải nới ở đây.
	client_max_body_size 20M;
	client_body_timeout  120s;

	add_header X-Content-Type-Options "nosniff"           always;
	add_header X-Frame-Options        "DENY"              always;
	add_header X-Robots-Tag           "noindex, nofollow" always;
	server_tokens off;

	gzip            on;
	gzip_min_length 1024;
	gzip_proxied    any;
	gzip_types      application/json application/javascript text/plain text/css image/svg+xml;

	access_log /var/log/nginx/admin.access.log;
	error_log  /var/log/nginx/admin.error.log warn;

	location = /robots.txt {
		add_header Content-Type text/plain;
		return 200 "User-agent: *\nDisallow: /\n";
	}

	location /login {
		limit_req zone=admin_login burst=3 nodelay;
		limit_req_status 429;
		proxy_pass http://inchem_admin;
		include snippets/proxy-inchem.conf;
	}

	location /_next/static/ {
		proxy_pass http://inchem_admin;
		include snippets/proxy-inchem.conf;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location / {
		proxy_pass http://inchem_admin;
		include snippets/proxy-inchem.conf;
	}
}

# ── :8081 — API NestJS ────────────────────────────────────
# Web và admin gọi API qua network nội bộ Docker (http://api:4000/api), KHÔNG
# qua nginx. Server block này chỉ để tự curl kiểm tra. Không cần thì đừng mở
# 8081 ở firewall — bỏ port ra khỏi ufw là đủ, không phải sửa file này.
server {
	listen 8081;
	listen [::]:8081;
	server_name _;

	client_max_body_size 20M;
	client_body_timeout  60s;

	add_header X-Content-Type-Options "nosniff"           always;
	add_header X-Frame-Options        "DENY"              always;
	add_header X-Robots-Tag           "noindex, nofollow" always;
	server_tokens off;

	gzip            on;
	gzip_min_length 1024;
	gzip_proxied    any;
	gzip_types      application/json application/javascript text/plain;

	access_log /var/log/nginx/api.access.log;
	error_log  /var/log/nginx/api.error.log warn;

	location /api/leads {
		limit_req zone=lead_limit burst=5 nodelay;
		limit_req_status 429;
		proxy_pass http://inchem_api;
		include snippets/proxy-inchem.conf;
	}

	# Swagger tắt ở production (NODE_ENV=production), chặn luôn cho chắc.
	location /api/docs {
		return 404;
	}

	location / {
		proxy_pass http://inchem_api;
		include snippets/proxy-inchem.conf;
	}
}
