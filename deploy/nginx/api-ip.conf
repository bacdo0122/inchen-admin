# ĐÃ LỖI THỜI — dùng ip.conf thay cho file này. ip.conf chạy cả web + admin +
# api bằng IP; file này chỉ có api và chiếm luôn "listen 80 default_server" nên
# bật kèm ip.conf sẽ lỗi duplicate. Giữ lại chỉ để tham khảo.
#
# Nginx TẠM THỜI — truy cập bằng IP, chỉ HTTP, KHÔNG có HTTPS.
# Dùng khi chưa có domain. Có domain rồi thì chuyển sang api.conf.
#
# Cài vào: /etc/nginx/sites-available/api-ip.conf → symlink sang sites-enabled/
# CHỈ BẬT MỘT TRONG HAI file (api.conf hoặc api-ip.conf) — bật cả hai sẽ lỗi
# duplicate directive ở map/limit_req_zone/upstream.

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

limit_req_zone $binary_remote_addr zone=lead_limit:10m rate=10r/m;

upstream inchem_api {
	server 127.0.0.1:4000;
	keepalive 32;
}

server {
	listen 80 default_server;
	listen [::]:80 default_server;

	# "_" = nhận mọi Host, kể cả khi client gõ thẳng IP.
	server_name _;

	client_max_body_size 20M;
	client_body_timeout  60s;

	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options        "DENY"    always;
	server_tokens off;

	gzip            on;
	gzip_min_length 1024;
	gzip_proxied    any;
	gzip_types      application/json application/javascript text/plain text/css image/svg+xml;

	access_log /var/log/nginx/api.access.log;
	error_log  /var/log/nginx/api.error.log warn;

	location /api/leads {
		limit_req zone=lead_limit burst=5 nodelay;
		limit_req_status 429;
		proxy_pass http://inchem_api;
		include snippets/proxy-inchem.conf;
	}

	location /api/docs {
		return 404;
	}

	location / {
		proxy_pass http://inchem_api;
		include snippets/proxy-inchem.conf;
	}
}
