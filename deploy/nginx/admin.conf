# Nginx cho admin CMS (Next.js, container bind 127.0.0.1:3001).
#
# ĐÂY LÀ TEMPLATE: __DOMAIN__ do install-domain.sh thay — xem api.conf.
# upstream inchem_admin và limit_req_zone admin_login khai báo trong api.conf.

server {
	listen 80;
	listen [::]:80;
	server_name admin.__DOMAIN__;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name admin.__DOMAIN__;

	# Cloudflare Origin Certificate — xem ghi chú trong api.conf.
	ssl_certificate     /etc/ssl/cloudflare/__DOMAIN__/origin.pem;
	ssl_certificate_key /etc/ssl/cloudflare/__DOMAIN__/origin.key;

	# Bắt buộc: limit_req zone=admin_login ở dưới chặn theo IP khách.
	include snippets/cloudflare-realip.conf;

	ssl_protocols             TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache         shared:SSL:10m;
	ssl_session_timeout       1d;
	ssl_session_tickets       off;

	# Upload ảnh đi qua route handler /api/upload của chính admin → phải nới ở đây.
	client_max_body_size 20M;
	client_body_timeout  120s;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options    "nosniff"          always;
	add_header X-Frame-Options           "DENY"             always;
	# Trang quản trị không nên xuất hiện trên Google
	add_header X-Robots-Tag              "noindex, nofollow" always;
	server_tokens off;

	gzip            on;
	gzip_min_length 1024;
	gzip_proxied    any;
	gzip_types      application/json application/javascript text/plain text/css image/svg+xml;

	access_log /var/log/nginx/admin.access.log;
	error_log  /var/log/nginx/admin.error.log warn;

	location = /robots.txt {
		add_header Content-Type text/plain;
		return 200 "User-agent: *\nDisallow: /\n";
	}

	location /login {
		limit_req zone=admin_login burst=3 nodelay;
		limit_req_status 429;
		proxy_pass http://inchem_admin;
		include snippets/proxy-inchem.conf;
	}

	location /_next/static/ {
		proxy_pass http://inchem_admin;
		include snippets/proxy-inchem.conf;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location / {
		proxy_pass http://inchem_admin;
		include snippets/proxy-inchem.conf;
	}
}
